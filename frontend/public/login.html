<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Posyandu</title><link rel="stylesheet" href="css/style.css"></head>
<body><nav id="nav"></nav>
<main class="container narrow">
  <h1>Login Petugas</h1>
  <div id="msg" class="msg hidden"></div>
  <form id="form" class="card">
    <label for="email">Email</label><input id="email" type="email" required autocomplete="username">
    <label for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password">
    <button id="btn" type="submit">Masuk</button>
  </form>
</main>
<script src="js/api.js"></script><script src="js/login.js"></script>
</body></html>
