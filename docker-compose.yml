services:
  gateway:
    build: ./backend/gateway
    ports:
      - "8080:8000"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      AUTH_URL: http://auth-service:8000
      ANTRIAN_URL: http://antrian-service:8000
      PASIEN_URL: http://pasien-service:8000
    depends_on:
      - auth-service

  auth-service:
    build: ./backend/auth-service
    expose:
      - "8000"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: sqlite:////data/auth.db
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PETUGAS_EMAIL: ${PETUGAS_EMAIL}
      PETUGAS_PASSWORD: ${PETUGAS_PASSWORD}
    volumes:
      - auth_data:/data

  # antrian-service dan pasien-service ditambahkan di tahap berikutnya

volumes:
  auth_data:
